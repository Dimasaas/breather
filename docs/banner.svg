<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Respiro: freio global cooperativo para APIs que devolvem 503">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1052"/>
      <stop offset="1" stop-color="#1b3a8a"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
      .pulso { animation: pulso 2.4s ease-in-out infinite; transform-origin: 1010px 160px; }
      .onda { stroke-dasharray: 6 8; animation: corre 3s linear infinite; }
      .cursor { animation: pisca 1.1s steps(1) infinite; }
      @keyframes pulso { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes corre { to { stroke-dashoffset: -28; } }
      @keyframes pisca { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .pulso, .onda, .cursor { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="320" fill="url(#fundo)"/>

  <text x="80" y="150" font-size="96" font-weight="700" fill="#ffffff">Respiro<tspan class="cursor" fill="#00E5FF">_</tspan></text>
  <text x="84" y="198" font-size="24" fill="#B388FF">freio global cooperativo para APIs que devolvem 503</text>
  <text x="84" y="240" font-size="18" fill="#00E5FF" opacity=".85">acionar! · aguardar! · backoff + teto + jitter · só idempotente é refeito</text>

  <!-- threads convergindo para uma barreira -->
  <g stroke="#B388FF" stroke-width="3" fill="none" stroke-linecap="round">
    <path class="onda" d="M720 100 H900"/>
    <path class="onda" d="M720 130 H900"/>
    <path class="onda" d="M720 160 H900"/>
    <path class="onda" d="M720 190 H900"/>
    <path class="onda" d="M720 220 H900"/>
  </g>
  <g class="pulso">
    <rect x="920" y="70" width="18" height="180" rx="9" fill="#00E5FF"/>
    <circle cx="1010" cy="160" r="46" fill="none" stroke="#00E5FF" stroke-width="4"/>
    <text x="1010" y="170" font-size="28" font-weight="700" fill="#00E5FF" text-anchor="middle">503</text>
  </g>
  <g fill="#B388FF">
    <circle cx="710" cy="100" r="6"/><circle cx="710" cy="130" r="6"/><circle cx="710" cy="160" r="6"/>
    <circle cx="710" cy="190" r="6"/><circle cx="710" cy="220" r="6"/>
  </g>
</svg>
