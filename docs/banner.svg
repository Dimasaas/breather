<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Breather: freio global cooperativo para APIs que devolvem 503">
  <defs>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB86B"/>
      <stop offset="0.55" stop-color="#FF4FA3"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e0d3d"/>
      <stop offset="1" stop-color="#120726"/>
    </linearGradient>
    <mask id="listras">
      <rect width="1280" height="320" fill="#fff"/>
      <rect x="880" y="168" width="260" height="3" fill="#000"/>
      <rect x="880" y="184" width="260" height="5" fill="#000"/>
      <rect x="880" y="202" width="260" height="7" fill="#000"/>
    </mask>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
      .pulso { animation: pulso 2.4s ease-in-out infinite; transform-origin: 1010px 130px; }
      .onda { stroke-dasharray: 6 8; animation: corre 3s linear infinite; }
      .cursor { animation: pisca 1.1s steps(1) infinite; }
      @keyframes pulso { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
      @keyframes corre { to { stroke-dashoffset: -28; } }
      @keyframes pisca { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .pulso, .onda, .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="320" fill="#120726"/>

  <!-- sol listrado, discreto, atras do 503 -->
  <circle cx="1010" cy="150" r="100" fill="url(#sol)" opacity=".42" mask="url(#listras)"/>

  <!-- chao em perspectiva -->
  <rect x="0" y="236" width="1280" height="84" fill="url(#chao)"/>
  <g stroke="#7C5CFF" stroke-width="1.2" opacity=".55" fill="none">
    <path d="M0 236 H1280"/><path d="M0 250 H1280"/><path d="M0 268 H1280"/><path d="M0 292 H1280"/><path d="M0 320 H1280"/>
    <path d="M640 236 L-200 320"/><path d="M640 236 L40 320"/><path d="M640 236 L280 320"/><path d="M640 236 L460 320"/>
    <path d="M640 236 L640 320"/>
    <path d="M640 236 L820 320"/><path d="M640 236 L1000 320"/><path d="M640 236 L1240 320"/><path d="M640 236 L1480 320"/>
  </g>
  <path d="M0 236 H1280" stroke="#4D8BFF" stroke-width="1.5" opacity=".8"/>

  <text x="80" y="140" font-size="96" font-weight="700" fill="#FF4FA3" filter="url(#brilho)">Breather<tspan class="cursor" fill="#FFB86B">_</tspan></text>
  <text x="84" y="184" font-size="23" fill="#F5EEFF">freio global cooperativo para APIs que devolvem 503</text>
  <text x="84" y="222" font-size="17" fill="#C3A8E6">acionar! · aguardar! · backoff + teto + jitter · só idempotente é refeito</text>

  <!-- threads convergindo para a barreira -->
  <g stroke="#7C5CFF" stroke-width="3" fill="none" stroke-linecap="round">
    <path class="onda" d="M720 70 H900"/>
    <path class="onda" d="M720 100 H900"/>
    <path class="onda" d="M720 130 H900"/>
    <path class="onda" d="M720 160 H900"/>
    <path class="onda" d="M720 190 H900"/>
  </g>
  <g fill="#4D8BFF">
    <circle cx="710" cy="70" r="6"/><circle cx="710" cy="100" r="6"/><circle cx="710" cy="130" r="6"/>
    <circle cx="710" cy="160" r="6"/><circle cx="710" cy="190" r="6"/>
  </g>
  <g class="pulso">
    <rect x="920" y="40" width="18" height="180" rx="9" fill="#FF4FA3"/>
    <circle cx="1010" cy="130" r="46" fill="none" stroke="#FF4FA3" stroke-width="4"/>
    <text x="1010" y="140" font-size="28" font-weight="700" fill="#F5EEFF" text-anchor="middle">503</text>
  </g>
</svg>
